    <script>
        function changeTheme(themeKey) {
            localStorage.setItem('site_theme', themeKey);
            applyTheme(themeKey);
            document.getElementById('themePanel').classList.add('hidden');
        }
        function applyTheme(themeKey) {
            if (themeKey === 'pink') document.documentElement.setAttribute('data-theme', 'pink');
            else if (themeKey === 'arisa') document.documentElement.setAttribute('data-theme', 'arisa');
            else document.documentElement.removeAttribute('data-theme'); 
            const egg = document.getElementById('arisa-easter-egg');
            if (egg) egg.style.display = (themeKey === 'arisa') ? 'inline' : 'none';
        }
        window.addEventListener('DOMContentLoaded', () => {
            applyTheme(localStorage.getItem('site_theme') || 'classic');
            document.addEventListener('click', function(e) {
                let panel = document.getElementById('themePanel');
                if (panel && !panel.classList.contains('hidden') && !e.target.closest('.fixed.top-4.right-4')) panel.classList.add('hidden');
            });
        });
    </script>
